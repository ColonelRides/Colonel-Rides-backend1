services:
  - type: web
    name: pullup-backend
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/pullup.db
      - key: AREA_BOUNDS
        value: "37.46,-84.50,37.86,-83.80"
      - key: STRIPE_SECRET_KEY
        sync: false
    disk:
      name: pullup-data
      mountPath: /data
      sizeGB: 1
